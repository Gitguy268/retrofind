<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrofind</title>
<meta name="description" content="Retrofind: private web search on your own computer, in the style of 1998.">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="vendor/liquid-glass-web/liquid-glass.css">
<link rel="stylesheet" href="retrofind.css">
<script type="module" src="retrofind.js"></script>
</head>
<body>
<canvas id="desktop" aria-hidden="true"></canvas>

<div class="window" id="window">
  <div class="titlebar">
    <img src="favicon.svg" alt="" width="16" height="16">
    <span class="title" id="windowTitle">Retrofind</span>
    <span class="controls">
      <button type="button" id="minimize" aria-label="Minimize"><span aria-hidden="true">_</span></button>
      <button type="button" id="maximize" aria-label="Maximize"><span aria-hidden="true">□</span></button>
      <button type="button" id="close" aria-label="Close"><span aria-hidden="true">×</span></button>
    </span>
  </div>
  <nav class="toolbar" aria-label="Browser">
    <button type="button" id="back">Back</button>
    <button type="button" id="forward">Forward</button>
    <a class="tool" href="/">Home</a>
    <label class="address">Address <input id="address" readonly></label>
  </nav>

  <div class="page" id="page">
    <main id="home">
      <h1 class="logo" aria-label="Retrofind"><span>R</span><span>e</span><span>t</span><span>r</span><span>o</span><span>f</span><span>i</span><span>n</span><span>d</span><sup>BETA</sup></h1>
      <form action="/search" class="home-form">
        <p>Search the web using Retrofind!</p>
        <input type="search" name="q" size="40" maxlength="400" aria-label="Search the web" autofocus>
        <p class="buttons">
          <button>Retrofind Search</button>
          <button name="lucky" value="1">I'm Feeling Lucky</button>
        </p>
        <fieldset>
          <legend>Search</legend>
          <label><input type="radio" name="categories" value="general" checked> Web</label>
          <label><input type="radio" name="categories" value="news"> News</label>
        </fieldset>
      </form>
      <p class="small">Private metasearch on your own computer, powered by <a href="https://github.com/searxng/searxng">SearXNG</a>.</p>
      <p class="small">Copyright ©2026 Retrofind. Not affiliated with Google or Microsoft.</p>
    </main>

    <main id="results" hidden>
      <form action="/search" class="top-form">
        <a href="/" class="logo small-logo" aria-label="Retrofind home"><span>R</span><span>e</span><span>t</span><span>r</span><span>o</span><span>f</span><span>i</span><span>n</span><span>d</span></a>
        <span>
          <input type="search" name="q" id="q" size="31" maxlength="400" aria-label="Search the web">
          <input type="hidden" name="categories" id="category">
          <button>Retrofind Search</button>
        </span>
      </form>
      <p class="bar" id="summary" aria-live="polite">Searching…</p>
      <div id="notes"></div>
      <ol id="list"></ol>
      <nav id="pager" aria-label="Result pages"></nav>
    </main>
  </div>
  <p class="statusbar"><span id="status">Done</span><span>127.0.0.1 · private</span></p>
</div>

<div class="taskbar">
  <a class="start" href="/"><img src="favicon.svg" alt="" width="16" height="16"> Start</a>
  <button type="button" class="task" id="task" aria-pressed="true"><img src="favicon.svg" alt="" width="16" height="16"> Retrofind</button>
  <time class="clock" id="clock"></time>
</div>

<dialog id="error">
  <div class="titlebar"><span class="title">Retrofind</span></div>
  <form method="dialog" class="dialog-body">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 31 29H1Z" fill="#ff0" stroke="#000"/><path d="M15 11h2v10h-2zM15 23h2v2h-2z"/></svg>
    <p id="errorText"></p>
    <button autofocus>OK</button>
  </form>
</dialog>
<script>
  // Module scripts do not run from file://, so this check is inline.
  if (location.protocol === 'file:') {
    document.getElementById('errorText').textContent =
      'Retrofind needs its small local server. Double-click start.command in the Retrofind folder, then use the page it opens.';
    document.getElementById('error').showModal();
  }
</script>
</body>
</html>
