name: Bug report
description: Something that does not work as described
title: ''
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **If Retrofind exposes a search or a service beyond your own computer, do not report it here.**
        Follow [SECURITY.md](https://github.com/Gitguy268/retrofind/blob/HEAD/SECURITY.md) instead.

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Browser and macOS versions
      placeholder: Brave 1.85, macOS 26.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Anything in the logs?
      description: Paste anything that looks wrong from ~/Library/Logs/Retrofind.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send this
      options:
        - label: I searched the open and closed issues for this.
